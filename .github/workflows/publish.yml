name: publish

# Publishes @leavepulse/ui to npmjs AND GitHub Packages on a version tag.
# Both, because consumers are split: the kit's home is npmjs, but apps that also
# depend on @leavepulse/sdk* pin the whole @leavepulse scope to GitHub Packages
# (npm resolves registries per scope, not per package), so a kit release that
# only lands on npmjs is invisible to them.
# Cut a release with:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node + the npm registry, so `npm publish` authenticates via
      # NODE_AUTH_TOKEN. bun builds; npm publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@leavepulse"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `publishConfig.registry` wins over a `--registry` flag, so retarget it
      # in place (the edit is CI-local and never committed) before republishing
      # the same build to GitHub Packages.
      - name: Publish to GitHub Packages
        run: |
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
