name: publish

# Publishes @leavepulse/ui to GitHub Packages on a version tag — the registry
# named by publishConfig in package.json, and the one consumers actually resolve
# from (see the npm.pkg.github.com URLs in their lockfiles).
#
# This used to target npmjs, where the @leavepulse scope does not exist: every
# release from v0.17.2 on failed with `404 PUT .../@leavepulse%2fui`, so the tag
# was cut but nothing shipped.
# Cut a release with:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required to publish to GitHub Packages with the workflow's own GITHUB_TOKEN.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node + the GitHub Packages registry, so `npm publish` authenticates via
      # NODE_AUTH_TOKEN. bun builds; npm publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@leavepulse"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          # The workflow's own token: publishing to GitHub Packages needs no
          # separate secret, unlike npmjs.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
