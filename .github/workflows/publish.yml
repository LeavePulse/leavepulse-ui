name: publish

# Publishes @leavepulse/ui to npmjs on a version tag. The whole @leavepulse
# scope lives on npmjs — sdk, control-sdk and sdk-nuxt publish there too, so
# consumers point the scope at one registry.
# Cut a release with:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Read the ci workflow's runs, to know whether the commit under the release
  # was already tested.
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit and its parent, to see what the release changed.
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node + the npm registry, so `npm publish` authenticates via
      # NODE_AUTH_TOKEN. bun builds; npm publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@leavepulse"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A release commit only bumps the version in package.json, on top of a
      # commit `ci` has just tested in full. Re-running the same suites here
      # doubled the time of every release (~6 min). They are skipped only when
      # BOTH hold: ci's own run on the parent concluded success, and the tag
      # differs from the parent in package.json's version alone. Anything else
      # runs the full suite as before.
      - name: Decide whether the parent was already tested
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent="$(git rev-parse HEAD^)"
          # `npm version` writes the version into package.json and
          # package-lock.json; no other file, and no other line, may differ.
          changed="$(git diff --name-only HEAD^ HEAD | grep -vxE 'package(-lock)?\.json' || true)"
          version_only=false
          if [ -z "$changed" ]; then
            other="$(git diff -U0 HEAD^ HEAD -- package.json package-lock.json | grep -E '^[-+][^-+]' | grep -vE '^[-+][[:space:]]*"version":' || true)"
            [ -z "$other" ] && version_only=true
          fi
          ci="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$parent" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$version_only" = true ] && [ "${ci:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tests skipped: ci passed on ${parent} and this release only changes the version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Full test run: version_only=${version_only}, green ci runs on ${parent}: ${ci:-0}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test
        if: steps.tested.outputs.skip != 'true'
        run: bun test

      - name: Install Chromium
        if: steps.tested.outputs.skip != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        if: steps.tested.outputs.skip != 'true'
        run: bun run test:browser

      - name: Build library
        run: bun run build

      - name: Check package contents
        run: npm run check:pack

      - name: Publish to npm
        # Built and checked above; prepublishOnly stays for a publish by hand.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
