name: ci

# Every push and pull request runs the same gates the release relies on, so a
# broken build or a tarball without declarations is caught before a tag.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx vue-tsc --noEmit -p tsconfig.build.json

      - name: Test
        run: bun test

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:browser

      - name: Build
        run: bun run build

      - name: Check package contents
        run: npm run check:pack
