name: cross-browser

# The full browser suite runs on Chromium for every push. Firefox and WebKit run
# nightly and on demand: slower, and a difference there is a finding to look at
# rather than something that should block a merge.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Browser tests
        run: bun run test:browser
        env:
          LP_TEST_BROWSER: ${{ matrix.browser }}
